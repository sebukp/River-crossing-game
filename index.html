<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Crossing Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            text-align: center;
            background-color: #eef2f3;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p.instructions {
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Game Board */
        #game-board {
            display: flex;
            width: 100%;
            max-width: 800px;
            height: 300px;
            margin: 0 auto;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background-color: #87CEEB;
            position: relative;
        }

        /* River Banks */
        .bank {
            width: 30%;
            height: 100%;
            background-color: #8B5A2B;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            z-index: 2;
        }

        #left-bank {
            border-right: 3px solid #5c3a1a;
        }

        #right-bank {
            border-left: 3px solid #5c3a1a;
        }

        /* River & Boat */
        #river {
            width: 40%;
            height: 100%;
            background-color: #1E90FF;
            position: relative;
        }

        #boat {
            width: 110px;
            height: 50px;
            background-color: #D2691E;
            border: 2px solid #5c2a00;
            border-radius: 0 0 25px 25px;
            position: absolute;
            bottom: 20px;
            left: 5px;
            transition: left 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        #boat.cross {
            left: calc(100% - 115px);
        }

        /* Game Characters/Items */
        .item {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .item:hover {
            transform: scale(1.05);
        }

        .item span.emoji {
            font-size: 24px;
        }

        .item span.label {
            font-size: 10px;
            font-weight: bold;
        }

        /* Controls & Message */
        #controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        #reset-btn {
            background-color: #f44336;
        }

        #reset-btn:hover {
            background-color: #da190b;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .success { color: green; }
        .danger { color: red; }
    </style>
</head>
<body>

    <h1>River Crossing Puzzle 🚣‍♂️</h1>
    <p class="instructions">
        <b>Rules:</b> The farmer can only carry one item at a time in the boat.<br> 
        Without the farmer present, the <b>wolf will eat the goat</b>, and the <b>goat will eat the cabbage</b>!
    </p>

    <div id="game-board">
        <!-- Left Bank -->
        <div id="left-bank" class="bank">
            <div class="item" id="farmer" onclick="moveToBoat('farmer')">
                <span class="emoji">👨‍🌾</span>
                <span class="label">Farmer</span>
            </div>
            <div class="item" id="wolf" onclick="moveToBoat('wolf')">
                <span class="emoji">🐺</span>
                <span class="label">Wolf</span>
            </div>
            <div class="item" id="goat" onclick="moveToBoat('goat')">
                <span class="emoji">🐐</span>
                <span class="label">Goat</span>
            </div>
            <div class="item" id="cabbage" onclick="moveToBoat('cabbage')">
                <span class="emoji">🥬</span>
                <span class="label">Cabbage</span>
            </div>
        </div>

        <!-- River & Boat -->
        <div id="river">
            <div id="boat"></div>
        </div>

        <!-- Right Bank -->
        <div id="right-bank" class="bank"></div>
    </div>

    <div id="controls">
        <button onclick="crossRiver()">Cross River 🚣</button>
        <button id="reset-btn" onclick="resetGame()">Reset Game 🔄</button>
    </div>

    <div id="message"></div>

    <script>
        // Game State
        const state = {
            farmer: 'left',
            wolf: 'left',
            goat: 'left',
            cabbage: 'left',
            boatPosition: 'left'
        };

        let isGameOver = false;

        // Move items between boat and banks on click
        function moveToBoat(item) {
            if (isGameOver) return;

            // Items can only be loaded if they are on the same side as the boat
            if (state[item] === state.boatPosition) {
                const itemsInBoat = Object.keys(state).filter(k => state[k] === 'boat');
                
                if (item === 'farmer') {
                    state.farmer = 'boat';
                } else {
                    // Check boat capacity (farmer + max 1 item)
                    if (itemsInBoat.includes('wolf') || itemsInBoat.includes('goat') || itemsInBoat.includes('cabbage')) {
                        showMessage("The boat can only hold one item along with the farmer!", "danger");
                        return;
                    }
                    state[item] = 'boat';
                }
            } else if (state[item] === 'boat') {
                // Unload item to the bank where the boat currently is
                state[item] = state.boatPosition;
            }

            render();
        }

        // Cross the river
        function crossRiver() {
            if (isGameOver) return;

            // Farmer must be in the boat to row
            if (state.farmer !== 'boat') {
                showMessage("The farmer must be in the boat to row across!", "danger");
                return;
            }

            // Move boat position
            state.boatPosition = state.boatPosition === 'left' ? 'right' : 'left';
            
            const boatElem = document.getElementById('boat');
            if (state.boatPosition === 'right') {
                boatElem.classList.add('cross');
            } else {
                boatElem.classList.remove('cross');
            }

            // Unload all items currently in the boat onto the new shore
            for (let key in state) {
                if (state[key] === 'boat') {
                    state[key] = state.boatPosition;
                }
            }

            render();
            checkGameRules();
        }

        // Check Win/Loss conditions
        function checkGameRules() {
            const farmerBank = state.farmer;

            // Wolf and Goat left alone
            if (state.wolf === state.goat && state.wolf !== farmerBank) {
                showMessage("Game Over! ❌ The wolf ate the goat while the farmer was away!", "danger");
                isGameOver = true;
                return;
            }

            // Goat and Cabbage left alone
            if (state.goat === state.cabbage && state.goat !== farmerBank) {
                showMessage("Game Over! ❌ The goat ate the cabbage while the farmer was away!", "danger");
                isGameOver = true;
                return;
            }

            // Win Condition (Everything moved to the right bank)
            if (state.farmer === 'right' && state.wolf === 'right' && state.goat === 'right' && state.cabbage === 'right') {
                showMessage("Congratulations! 🎉 You safely brought everyone to the other side!", "success");
                isGameOver = true;
            }
        }

        // Update visual elements on screen
        function render() {
            const leftBank = document.getElementById('left-bank');
            const rightBank = document.getElementById('right-bank');
            const boat = document.getElementById('boat');

            ['farmer', 'wolf', 'goat', 'cabbage'].forEach(id => {
                const elem = document.getElementById(id);
                if (state[id] === 'left') {
                    leftBank.appendChild(elem);
                } else if (state[id] === 'right') {
                    rightBank.appendChild(elem);
                } else if (state[id] === 'boat') {
                    boat.appendChild(elem);
                }
            });
        }

        function showMessage(msg, type) {
            const msgElem = document.getElementById('message');
            msgElem.innerText = msg;
            msgElem.className = type;
        }

        function resetGame() {
            state.farmer = 'left';
            state.wolf = 'left';
            state.goat = 'left';
            state.cabbage = 'left';
            state.boatPosition = 'left';
            isGameOver = false;

            document.getElementById('boat').classList.remove('cross');
            showMessage("", "");
            render();
        }

        // Initial rendering on launch
        render();
    </script>
</body>
</html>
